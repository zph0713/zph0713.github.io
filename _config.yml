# _config.yml — Peihao's Garden
# Personal blog: DevOps & AI / Interests & Life / Economy & Current Events / Language Learning

title: "Peihao's Garden"
description: "Personal blog by Peihao Zhou — DevOps & AI engineering, life interests, economy & current events, and language learning."
author: "Peihao Zhou"
tagline: "Code · Life · Economy · Language"

baseurl: ""
url: "https://zph0713.github.io"

# GitHub Pages builds in UTC; without this, a post dated "today" in CST
# is parsed as future-dated and silently skipped. Author dates are CST.
timezone: Asia/Shanghai

markdown: kramdown
highlighter: rouge

permalink: /posts/:title/

# Build plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# ── Chinese mirror ──────────────────────────────
# English posts stay the canonical, native content in `_posts/` (unchanged:
# categories, feed, home page all keep listing only site.posts). Optional
# Simplified-Chinese translations live in `_zh/*.md` (collection "zh"),
# rendered at /zh/:title/. Each zh doc declares `translation_of:` pointing at
# its English original URL; the post layout auto-links both ways.
collections:
  zh:
    output: true
    permalink: /zh/:title/

category_names_zh:
  tech: "DevOps 与 AI"
  hobby: "兴趣与生活"
  economy: "经济与观察"
  language: "语言学习"

# Default layout for posts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# ── Columns ─────────────────────────────────
# New posts: put categories: [tech] / [hobby] / [economy] / [language] in frontmatter
category_names:
  tech: "DevOps & AI"
  hobby: "Interests & Life"
  economy: "Economy & Current Events"
  language: "Language Learning"

category_icons:
  tech: "🛠️"
  hobby: "🎨"
  economy: "📈"
  language: "📚"

category_desc:
  tech: "Kubernetes, CI/CD, cloud-native & AI engineering notes"
  hobby: "Basketball, music & everything that makes life fun"
  economy: "Macro trends, market moves & my take on the news"
  language: "My English learning journey — tips, notes & practice logs"
