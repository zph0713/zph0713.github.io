# _config.yml — Peihao's Garden
# Personal blog: DevOps & AI / Interests & Life / Economy & Current Events / Language Learning

title: "Peihao's Garden"
description: "Personal blog by Peihao Zhou — DevOps & AI engineering, life interests, economy & current events, and language learning."
author: "Peihao Zhou"
tagline: "Code · Life · Economy · Language"

baseurl: ""
url: "https://zph0713.github.io"

markdown: kramdown
highlighter: rouge

permalink: /posts/:title/

# Build plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Default layout for posts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# ── Columns ─────────────────────────────────
# New posts: put categories: [tech] / [hobby] / [economy] / [language] in frontmatter
category_names:
  tech: "DevOps & AI"
  hobby: "Interests & Life"
  economy: "Economy & Current Events"
  language: "Language Learning"

category_icons:
  tech: "🛠️"
  hobby: "🎨"
  economy: "📈"
  language: "📚"

category_desc:
  tech: "Kubernetes, CI/CD, cloud-native & AI engineering notes"
  hobby: "Basketball, music & everything that makes life fun"
  economy: "Macro trends, market moves & my take on the news"
  language: "My English learning journey — tips, notes & practice logs"
