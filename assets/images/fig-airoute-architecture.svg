<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1172" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111b30"/><stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9db1d8"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="799" height="1171" rx="18" fill="url(#bg)" stroke="#223352" stroke-width="1"/>

  <!-- header -->
  <text x="40" y="36" font-size="12.5" font-weight="bold" letter-spacing="2" fill="#67e8f9">AIROUTE — AI CAPABILITY GATEWAY</text>
  <text x="760" y="36" font-size="12" font-style="italic" fill="#8fa3c8" text-anchor="end">routing · metering · control, key by key</text>

  <!-- legend -->
  <rect x="52" y="58" width="14" height="9" rx="2" fill="rgba(6,78,59,0.45)" stroke="#34d399" stroke-width="1"/>
  <text x="74" y="66" font-size="8.5" fill="#c9d4ea">data plane — ours: the request path</text>
  <rect x="296" y="58" width="14" height="9" rx="2" fill="rgba(120,53,15,0.35)" stroke="#fbbf24" stroke-width="1"/>
  <text x="318" y="66" font-size="8.5" fill="#c9d4ea">control plane — ours: billing &amp; policy</text>
  <rect x="548" y="58" width="14" height="9" rx="2" fill="rgba(76,29,149,0.45)" stroke="#a78bfa" stroke-width="1"/>
  <text x="570" y="66" font-size="8.5" fill="#c9d4ea">litellm engine &amp; stores — 3rd party</text>
  <rect x="52" y="80" width="14" height="9" rx="2" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1"/>
  <text x="74" y="88" font-size="8.5" fill="#c9d4ea">external systems (businesses · upstream AI providers)</text>
  <rect x="420" y="80" width="14" height="9" rx="2" fill="transparent" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="442" y="88" font-size="8.5" fill="#c9d4ea">dashed border = the self-built gateway scope</text>

  <!-- top: business systems (external) -->
  <rect x="52" y="106" width="696" height="72" rx="10" fill="rgba(30,41,59,0.55)" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="70" y="130" font-size="11" font-weight="bold" fill="#ffffff">BUSINESS SYSTEMS — the first adopter today, any tenant tomorrow</text>
  <text x="70" y="148" font-size="9" fill="#c9d4ea">OpenAI-compatible SDK · base_url → http://airoute/v1 — zero code change to onboard</text>
  <text x="70" y="164" font-size="8.5" fill="#8fa3c8">header carries a virtual key: Authorization: Bearer sk-air-… — real upstream keys never leave the gateway</text>

  <!-- call arrow -->
  <line x1="575" y1="180" x2="575" y2="246" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrS)"/>
  <text x="588" y="216" font-size="8.5" fill="#94a3b8">OpenAI-compatible call</text>

  <!-- self-built scope -->
  <rect x="30" y="198" width="740" height="818" rx="14" fill="rgba(8,51,68,0.07)" stroke="#22d3ee" stroke-width="1.3" stroke-dasharray="8,4"/>
  <text x="46" y="220" font-size="10.5" font-weight="bold" fill="#67e8f9">AIROUTE — inside this border: our code (data + control plane) and the in-process litellm engine</text>

  <!-- ================= LEFT: control plane ================= -->
  <rect x="46" y="236" width="336" height="436" rx="10" fill="rgba(120,53,15,0.10)" stroke="#fbbf24" stroke-width="1.4"/>
  <text x="62" y="258" font-size="10.5" font-weight="bold" fill="#fcd34d">CONTROL PLANE — our business logic</text>
  <text x="62" y="273" font-size="8.5" fill="#8fa3c8">nothing on the request path depends on it — it evolves on its own</text>

  <!-- 8 cells (2x4) -->
  <g font-size="8.5">
    <rect x="58" y="286" width="150" height="72" rx="4" fill="rgba(120,53,15,0.22)" stroke="#fbbf24" stroke-width="1"/>
    <text x="66" y="305" font-size="9" font-weight="bold" fill="#ffffff">Tenants &amp; virtual keys</text>
    <text x="66" y="321" fill="#c9d4ea">issue · revoke · quota · expiry</text>
    <text x="66" y="335" fill="#8fa3c8">sk-air-* never leaks real keys</text>

    <rect x="220" y="286" width="150" height="72" rx="4" fill="rgba(120,53,15,0.22)" stroke="#fbbf24" stroke-width="1"/>
    <text x="228" y="305" font-size="9" font-weight="bold" fill="#ffffff">Key pools — five modes</text>
    <text x="228" y="321" fill="#c9d4ea">BYOK · self-op · authorized</text>
    <text x="228" y="335" fill="#8fa3c8">partner · self-hosted local</text>

    <rect x="58" y="366" width="150" height="72" rx="4" fill="rgba(120,53,15,0.22)" stroke="#fbbf24" stroke-width="1"/>
    <text x="66" y="385" font-size="9" font-weight="bold" fill="#ffffff">Subscriptions &amp; billing</text>
    <text x="66" y="401" fill="#c9d4ea">token &amp; request quotas</text>
    <text x="66" y="415" fill="#8fa3c8">tiers · overage policy</text>

    <rect x="220" y="366" width="150" height="72" rx="4" fill="rgba(120,53,15,0.22)" stroke="#fbbf24" stroke-width="1"/>
    <text x="228" y="385" font-size="9" font-weight="bold" fill="#ffffff">Routing policies</text>
    <text x="228" y="401" fill="#c9d4ea">source priority chains</text>
    <text x="228" y="415" fill="#8fa3c8">pool algorithm per pool</text>

    <rect x="58" y="446" width="150" height="72" rx="4" fill="rgba(120,53,15,0.22)" stroke="#fbbf24" stroke-width="1"/>
    <text x="66" y="465" font-size="9" font-weight="bold" fill="#ffffff">Usage webhooks</text>
    <text x="66" y="481" fill="#c9d4ea">80% / 100% thresholds</text>
    <text x="66" y="495" fill="#8fa3c8">anomalies → paywall hook</text>

    <rect x="220" y="446" width="150" height="72" rx="4" fill="rgba(120,53,15,0.22)" stroke="#fbbf24" stroke-width="1"/>
    <text x="228" y="465" font-size="9" font-weight="bold" fill="#ffffff">Reconciliation</text>
    <text x="228" y="481" fill="#c9d4ea">internal cost reports</text>
    <text x="228" y="495" fill="#8fa3c8">settlement per pool</text>

    <rect x="58" y="526" width="150" height="72" rx="4" fill="rgba(120,53,15,0.22)" stroke="#fbbf24" stroke-width="1"/>
    <text x="66" y="545" font-size="9" font-weight="bold" fill="#ffffff">Cache &amp; privacy</text>
    <text x="66" y="561" fill="#c9d4ea">TTL · tenant isolation</text>
    <text x="66" y="575" fill="#8fa3c8">sensitive tasks: never cached</text>

    <rect x="220" y="526" width="150" height="72" rx="4" fill="rgba(120,53,15,0.22)" stroke="#fbbf24" stroke-width="1"/>
    <text x="228" y="545" font-size="9" font-weight="bold" fill="#ffffff">Canary &amp; shadow</text>
    <text x="228" y="561" fill="#c9d4ea">weighted canary · rollback</text>
    <text x="228" y="575" fill="#8fa3c8">shadow calls: never billed</text>
  </g>

  <!-- admin API bar -->
  <rect x="58" y="612" width="312" height="44" rx="6" fill="rgba(120,53,15,0.30)" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="70" y="631" font-size="9.5" font-weight="bold" fill="#ffffff">REST management API</text>
  <text x="70" y="646" font-size="8" fill="#c2b28a">business onboarding · admin UI later — API first</text>

  <text x="62" y="668" font-size="8" fill="#64748b">gateway nodes stateless · shared stores · scale by adding replicas</text>

  <!-- ================= RIGHT: data plane ================= -->
  <rect x="398" y="236" width="356" height="436" rx="10" fill="rgba(6,78,59,0.13)" stroke="#34d399" stroke-width="1.4"/>

  <!-- 1 ingress -->
  <rect x="410" y="252" width="332" height="84" rx="6" fill="rgba(6,78,59,0.35)" stroke="#34d399" stroke-width="1.3"/>
  <text x="420" y="272" font-size="10" font-weight="bold" fill="#6ee7b7">① INGRESS GATEWAY</text>
  <text x="420" y="289" font-size="9" fill="#cbd5e1">OpenAI-compatible /v1/chat/completions — zero business change</text>
  <text x="420" y="304" font-size="9" fill="#cbd5e1">virtual-key auth · token-bucket rate limit · quota precheck</text>
  <text x="420" y="319" font-size="9" fill="#cbd5e1">task tiering via X-Task-Type → cheap / standard / premium</text>
  <line x1="575" y1="338" x2="575" y2="346" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- 2 router -->
  <rect x="410" y="348" width="332" height="96" rx="6" fill="rgba(6,78,59,0.35)" stroke="#34d399" stroke-width="1.5"/>
  <text x="420" y="368" font-size="10" font-weight="bold" fill="#6ee7b7">② ROUTER — the core decision</text>
  <text x="420" y="385" font-size="9" fill="#cbd5e1">cache hit → instant return — saves 70–90% of tokens</text>
  <text x="420" y="401" font-size="9" fill="#cbd5e1">source decision: whose money — BYOK user → their own key</text>
  <text x="420" y="417" font-size="9" fill="#cbd5e1">no / weak key → platform pool via configurable priority chain</text>
  <text x="420" y="433" font-size="9" fill="#cbd5e1">pick key: round-robin · quota · cost · latency · health</text>
  <line x1="575" y1="446" x2="575" y2="454" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- 3 dispatcher -->
  <rect x="410" y="456" width="332" height="84" rx="6" fill="rgba(6,78,59,0.35)" stroke="#34d399" stroke-width="1.3"/>
  <text x="420" y="476" font-size="10" font-weight="bold" fill="#6ee7b7">③ DISPATCHER</text>
  <text x="420" y="493" font-size="9" fill="#cbd5e1">per-key concurrency semaphore — queue, never blast upstream</text>
  <text x="420" y="508" font-size="9" fill="#cbd5e1">retry convergence · circuit breaker · health remove/restore</text>
  <text x="420" y="523" font-size="9" fill="#cbd5e1">SSE passthrough, zero buffer → engine outbound (below)</text>
  <line x1="575" y1="542" x2="575" y2="550" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- 4 metering -->
  <rect x="410" y="552" width="332" height="84" rx="6" fill="rgba(6,78,59,0.35)" stroke="#34d399" stroke-width="1.3"/>
  <text x="420" y="572" font-size="10" font-weight="bold" fill="#6ee7b7">④ METERING</text>
  <text x="420" y="589" font-size="9" fill="#cbd5e1">usage caught at stream tail — never buffers the stream</text>
  <text x="420" y="604" font-size="9" fill="#cbd5e1">atomic: who · pool · key · tokens · cost — idempotent row</text>
  <text x="420" y="619" font-size="9" fill="#cbd5e1">async persist → audit &amp; reconciliation ready</text>

  <!-- metering -> postgres -->
  <line x1="575" y1="638" x2="575" y2="704" stroke="#34d399" stroke-width="1.6" marker-end="url(#arrG)"/>

  <!-- shared stores -->
  <rect x="46" y="706" width="336" height="64" rx="8" fill="rgba(76,29,149,0.28)" stroke="#a78bfa" stroke-width="1.4"/>
  <text x="58" y="726" font-size="9.5" font-weight="bold" fill="#d8b4fe">REDIS 7</text>
  <text x="58" y="741" font-size="8.5" fill="#c4b5fd">rate counters · semantic cache · locks · metering queue (Stream)</text>
  <text x="58" y="755" font-size="8.5" fill="#c4b5fd">shared state that keeps gateway nodes stateless</text>

  <rect x="398" y="706" width="356" height="64" rx="8" fill="rgba(76,29,149,0.28)" stroke="#a78bfa" stroke-width="1.4"/>
  <text x="410" y="726" font-size="9.5" font-weight="bold" fill="#d8b4fe">POSTGRESQL 16</text>
  <text x="410" y="741" font-size="8.5" fill="#c4b5fd">metadata · accounting ledger · audit trail</text>
  <text x="410" y="755" font-size="8.5" fill="#c4b5fd">metering rows land here via async batch workers (peak-shaving)</text>

  <!-- ================= litellm engine ================= -->
  <rect x="46" y="788" width="708" height="224" rx="10" fill="rgba(76,29,149,0.20)" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="62" y="810" font-size="10.5" font-weight="bold" fill="#d8b4fe">LITELLM ENGINE — in-process third-party dependency · MIT · version-locked, we never fork it</text>
  <line x1="62" y1="822" x2="738" y2="822" stroke="rgba(167,139,250,0.35)" stroke-width="1"/>

  <text x="62" y="844" font-size="9.5" font-weight="bold" fill="#d8b4fe">THE ENGINE DOES — translation</text>
  <g font-size="8.5" fill="#cbd5e1">
    <text x="62" y="860">▸ 100+ provider adapters (OpenAI · Anthropic ·</text>
    <text x="66" y="874">Gemini · DeepSeek · local OpenAI-compatible…</text>
    <text x="62" y="891">▸ request / response translation · auth headers</text>
    <text x="62" y="905">▸ SSE streaming primitives (async iteration)</text>
    <text x="62" y="919">▸ usage(token) normalization — PoC-verified</text>
    <text x="62" y="933">▸ model cost tables &amp; pricing (localizable)</text>
    <text x="62" y="947">▸ tool-call &amp; multimodal parameter mapping</text>
  </g>

  <text x="318" y="844" font-size="9.5" font-weight="bold" fill="#fda4af">THE ENGINE DOES NOT — that is ours</text>
  <g font-size="8.5" fill="#e3b4bc">
    <text x="318" y="860">✗ identity · virtual keys · tenancy</text>
    <text x="318" y="876">✗ routing — whose key pays (pool decisions)</text>
    <text x="318" y="892">✗ rate limits · quotas · subscription billing</text>
    <text x="318" y="908">✗ metering ledger · audit · reconciliation</text>
    <text x="318" y="924">✗ semantic cache · fallback · canary policies</text>
    <text x="318" y="940">✗ admin API · console · reporting</text>
  </g>

  <text x="568" y="844" font-size="9.5" font-weight="bold" fill="#67e8f9">OUR ENGINEERING GUARDS</text>
  <g font-size="8.5" fill="#cbd5e1">
    <text x="568" y="860">· adapters/ = the only touchpoint;</text>
    <text x="568" y="876">  business code never imports it</text>
    <text x="568" y="892">· upgrade = lock version + contract</text>
    <text x="568" y="908">  tests (PoC: 7 integration tests)</text>
    <text x="568" y="924">· generic features PR'd upstream —</text>
    <text x="568" y="940">  upgrade then delivers them free</text>
    <text x="568" y="956">· worst case: fork the library only</text>
    <text x="568" y="972">  (library fork ≪ proxy fork)</text>
  </g>

  <text x="62" y="1000" font-size="8.5" fill="#fda4af">boundary rule — the engine never sees user identity or billing logic: only a chosen key + a request to translate</text>

  <!-- outbound arrow through the scope border to the upstream bus -->
  <line x1="575" y1="1014" x2="575" y2="1050" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrV)"/>
  <line x1="60" y1="1052" x2="740" y2="1052" stroke="#a78bfa" stroke-width="1.1" stroke-dasharray="5,4"/>

  <!-- ================= upstream providers (external) ================= -->
  <g>
    <rect x="46" y="1072" width="132" height="64" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="112" y="1096" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">OpenAI</text>
    <text x="112" y="1113" font-size="8" fill="#94a3b8" text-anchor="middle">official API</text>
    <line x1="112" y1="1052" x2="112" y2="1069" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrS)"/>
  </g>
  <g>
    <rect x="190" y="1072" width="132" height="64" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="256" y="1096" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Anthropic</text>
    <text x="256" y="1113" font-size="8" fill="#94a3b8" text-anchor="middle">Claude family</text>
    <line x1="256" y1="1052" x2="256" y2="1069" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrS)"/>
  </g>
  <g>
    <rect x="334" y="1072" width="132" height="64" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="400" y="1096" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Gemini</text>
    <text x="400" y="1113" font-size="8" fill="#94a3b8" text-anchor="middle">Google</text>
    <line x1="400" y1="1052" x2="400" y2="1069" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrS)"/>
  </g>
  <g>
    <rect x="478" y="1072" width="132" height="64" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="544" y="1096" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">DeepSeek</text>
    <text x="544" y="1113" font-size="8" fill="#94a3b8" text-anchor="middle">OpenAI-compatible</text>
    <line x1="544" y1="1052" x2="544" y2="1069" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrS)"/>
  </g>
  <g>
    <rect x="622" y="1072" width="132" height="64" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="688" y="1096" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Local AI</text>
    <text x="688" y="1113" font-size="8" fill="#94a3b8" text-anchor="middle">vLLM · LM Studio</text>
    <line x1="688" y1="1052" x2="688" y2="1069" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrS)"/>
  </g>

  <text x="400" y="1158" font-size="8.5" font-style="italic" fill="#64748b" text-anchor="middle">every upstream rides the same route → meter → bill path — engine adapters make them interchangeable</text>
</svg>
