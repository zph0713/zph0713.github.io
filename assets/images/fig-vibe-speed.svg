<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 345" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111b30"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="799" height="344" rx="18" fill="url(#bg)" stroke="#223352" stroke-width="1"/>

  <text x="40" y="34" font-size="16" font-weight="bold" fill="#ffffff">Old path vs. the line</text>
  <rect x="500" y="24" width="10" height="10" rx="2" fill="#94a3b8" opacity="0.8"/>
  <text x="516" y="33" font-size="10.5" fill="#cbd5e1">traditional solo build</text>
  <rect x="648" y="24" width="10" height="10" rx="2" fill="#34d399"/>
  <text x="664" y="33" font-size="10.5" fill="#6ee7b7">vibe assembly line</text>

  <!-- rows: label right-aligned at x=240, bars start x=250, scale = 510px / 180 days -->
  <!-- row 1 -->
  <text x="240" y="66" font-size="10.5" fill="#dbe4f3" text-anchor="end">idea → prioritized</text>
  <text x="240" y="80" font-size="10.5" fill="#dbe4f3" text-anchor="end">brief</text>
  <rect x="250" y="62" width="40" height="10" rx="5" fill="#94a3b8" opacity="0.55"/>
  <circle cx="290" cy="67" r="3" fill="#94a3b8" opacity="0.85"/>
  <text x="296" y="70" font-size="9.5" fill="#cbd5e1">1–2 wks</text>
  <rect x="250" y="86" width="8" height="10" rx="4" fill="#34d399" filter="url(#glow)"/>
  <circle cx="258" cy="91" r="3" fill="#6ee7b7"/>
  <text x="262" y="94" font-size="9.5" fill="#6ee7b7">≈ 1 evening</text>

  <!-- row 2 -->
  <text x="240" y="116" font-size="10.5" fill="#dbe4f3" text-anchor="end">first working</text>
  <text x="240" y="130" font-size="10.5" fill="#dbe4f3" text-anchor="end">version</text>
  <rect x="250" y="112" width="91" height="10" rx="5" fill="#94a3b8" opacity="0.55"/>
  <circle cx="341" cy="117" r="3" fill="#94a3b8" opacity="0.85"/>
  <text x="347" y="120" font-size="9.5" fill="#cbd5e1">3–6 wks</text>
  <rect x="250" y="136" width="9" height="10" rx="4" fill="#34d399" filter="url(#glow)"/>
  <circle cx="259" cy="141" r="3" fill="#6ee7b7"/>
  <text x="263" y="144" font-size="9.5" fill="#6ee7b7">2–4 days</text>

  <!-- row 3 -->
  <text x="240" y="166" font-size="10.5" fill="#dbe4f3" text-anchor="end">first real-user</text>
  <text x="240" y="180" font-size="10.5" fill="#dbe4f3" text-anchor="end">feedback</text>
  <rect x="250" y="162" width="170" height="10" rx="5" fill="#94a3b8" opacity="0.55"/>
  <circle cx="420" cy="167" r="3" fill="#94a3b8" opacity="0.85"/>
  <text x="426" y="170" font-size="9.5" fill="#cbd5e1">≈ month 2</text>
  <rect x="250" y="186" width="14" height="10" rx="4" fill="#34d399" filter="url(#glow)"/>
  <circle cx="264" cy="191" r="3" fill="#6ee7b7"/>
  <text x="268" y="194" font-size="9.5" fill="#6ee7b7">day 4–6</text>

  <!-- row 4 -->
  <text x="240" y="216" font-size="10.5" fill="#dbe4f3" text-anchor="end">ten features</text>
  <text x="240" y="230" font-size="10.5" fill="#dbe4f3" text-anchor="end">+ polish</text>
  <rect x="250" y="212" width="425" height="10" rx="5" fill="#94a3b8" opacity="0.55"/>
  <circle cx="675" cy="217" r="3" fill="#94a3b8" opacity="0.85"/>
  <text x="681" y="220" font-size="9.5" fill="#cbd5e1">4–6 months</text>
  <rect x="250" y="236" width="79" height="10" rx="4" fill="#34d399" filter="url(#glow)"/>
  <circle cx="329" cy="241" r="3" fill="#6ee7b7"/>
  <text x="333" y="244" font-size="9.5" fill="#6ee7b7">3–5 weeks</text>

  <!-- axis -->
  <line x1="250" y1="268" x2="760" y2="268" stroke="#33415c" stroke-width="1.2"/>
  <line x1="250" y1="264" x2="250" y2="272" stroke="#33415c" stroke-width="1.2"/><text x="250" y="286" font-size="9.5" fill="#64748b" text-anchor="middle">0</text>
  <line x1="335" y1="264" x2="335" y2="272" stroke="#33415c" stroke-width="1.2"/><text x="335" y="286" font-size="9.5" fill="#64748b" text-anchor="middle">30d</text>
  <line x1="420" y1="264" x2="420" y2="272" stroke="#33415c" stroke-width="1.2"/><text x="420" y="286" font-size="9.5" fill="#64748b" text-anchor="middle">60d</text>
  <line x1="505" y1="264" x2="505" y2="272" stroke="#33415c" stroke-width="1.2"/><text x="505" y="286" font-size="9.5" fill="#64748b" text-anchor="middle">90d</text>
  <line x1="590" y1="264" x2="590" y2="272" stroke="#33415c" stroke-width="1.2"/><text x="590" y="286" font-size="9.5" fill="#64748b" text-anchor="middle">120d</text>
  <line x1="675" y1="264" x2="675" y2="272" stroke="#33415c" stroke-width="1.2"/><text x="675" y="286" font-size="9.5" fill="#64748b" text-anchor="middle">150d</text>
  <line x1="760" y1="264" x2="760" y2="272" stroke="#33415c" stroke-width="1.2"/><text x="760" y="286" font-size="9.5" fill="#64748b" text-anchor="middle">180d</text>

  <text x="400" y="320" font-size="11" font-style="italic" fill="#8fa3c8" text-anchor="middle">calendar days for a small consumer tool, built solo — orders of magnitude, not benchmarks</text>
  <text x="400" y="336" font-size="11" font-style="italic" fill="#8fa3c8" text-anchor="middle">the pipeline compresses waiting time — the thinking still takes as long as it takes</text>
</svg>
