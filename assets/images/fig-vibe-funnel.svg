<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111b30"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="799" height="359" rx="18" fill="url(#bg)" stroke="#223352" stroke-width="1"/>

  <text x="40" y="38" font-size="16" font-weight="bold" fill="#ffffff">Diverge, then prune</text>
  <text x="760" y="38" font-size="12" font-style="italic" fill="#8fa3c8" text-anchor="end">the AI floods the funnel — you own the gate</text>

  <!-- scattered requirement cards pouring in -->
  <rect x="50" y="54" width="62" height="22" rx="6" fill="#22d3ee" opacity="0.10" stroke="#22d3ee" stroke-opacity="0.45"/>
  <rect x="128" y="76" width="62" height="22" rx="6" fill="#818cf8" opacity="0.10" stroke="#818cf8" stroke-opacity="0.45"/>
  <rect x="212" y="52" width="62" height="22" rx="6" fill="#a78bfa" opacity="0.10" stroke="#a78bfa" stroke-opacity="0.45"/>
  <rect x="300" y="82" width="62" height="22" rx="6" fill="#34d399" opacity="0.10" stroke="#34d399" stroke-opacity="0.45"/>
  <rect x="384" y="54" width="62" height="22" rx="6" fill="#22d3ee" opacity="0.10" stroke="#22d3ee" stroke-opacity="0.45"/>
  <rect x="470" y="78" width="62" height="22" rx="6" fill="#818cf8" opacity="0.10" stroke="#818cf8" stroke-opacity="0.45"/>
  <rect x="556" y="52" width="62" height="22" rx="6" fill="#a78bfa" opacity="0.10" stroke="#a78bfa" stroke-opacity="0.45"/>
  <rect x="648" y="78" width="62" height="22" rx="6" fill="#34d399" opacity="0.10" stroke="#34d399" stroke-opacity="0.45"/>
  <rect x="726" y="56" width="50" height="22" rx="6" fill="#fbbf24" opacity="0.10" stroke="#fbbf24" stroke-opacity="0.45"/>
  <rect x="92" y="94" width="62" height="22" rx="6" fill="#fbbf24" opacity="0.10" stroke="#fbbf24" stroke-opacity="0.45"/>
  <text x="600" y="104" font-size="10" fill="#8fa3c8">what if…?</text>
  <text x="120" y="106" font-size="10" fill="#8fa3c8">edge case?</text>

  <!-- the funnel -->
  <polygon points="70,104 730,104 470,250 330,250" fill="#a5b4fc" opacity="0.06"/>
  <line x1="70" y1="104" x2="330" y2="250" stroke="#a5b4fc" stroke-opacity="0.55" stroke-width="1.5"/>
  <line x1="730" y1="104" x2="470" y2="250" stroke="#a5b4fc" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="400" y="152" font-size="11.5" fill="#93a5c8" text-anchor="middle">AI diverges: sub-requirements · edge cases ·</text>
  <text x="400" y="174" font-size="11.5" fill="#93a5c8" text-anchor="middle">platform variants · adjacent users · what-ifs</text>

  <!-- MVP tray -->
  <rect x="245" y="264" width="310" height="58" rx="12" fill="#34d399" opacity="0.08" stroke="#34d399" stroke-opacity="0.6" stroke-width="1.5"/>
  <rect x="258" y="270" width="78" height="24" rx="6" fill="#34d399" opacity="0.16" stroke="#34d399" stroke-opacity="0.8"/>
  <rect x="344" y="270" width="78" height="24" rx="6" fill="#34d399" opacity="0.16" stroke="#34d399" stroke-opacity="0.8"/>
  <rect x="430" y="270" width="78" height="24" rx="6" fill="#34d399" opacity="0.16" stroke="#34d399" stroke-opacity="0.8"/>
  <text x="400" y="312" font-size="11" fill="#6ee7b7" text-anchor="middle">MVP scope — only Musts make the cut</text>
  <polygon points="398,256 402,256 400,261" fill="#6ee7b7"/>

  <!-- deferred backlog card -->
  <rect x="585" y="266" width="190" height="42" rx="8" fill="#fbbf24" opacity="0.06" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="1.2"/>
  <text x="680" y="284" font-size="11" font-weight="bold" fill="#fcd34d" text-anchor="middle">deferred backlog</text>
  <text x="680" y="300" font-size="10" fill="#c9a94e" text-anchor="middle">Should · Could · later, not lost</text>

  <!-- non-goals card -->
  <rect x="585" y="312" width="190" height="34" rx="8" fill="#f87171" opacity="0.05" stroke="#f87171" stroke-opacity="0.5" stroke-width="1.2"/>
  <text x="680" y="332" font-size="11" font-weight="bold" fill="#fda4af" text-anchor="middle" text-decoration="line-through">non-goals — refused on purpose</text>
</svg>
