<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111b30"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="799" height="399" rx="18" fill="url(#bg)" stroke="#223352" stroke-width="1"/>

  <text x="40" y="38" font-size="16" font-weight="bold" fill="#ffffff">One verified brick per loop</text>
  <text x="760" y="38" font-size="12" font-style="italic" fill="#8fa3c8" text-anchor="end">v1 → v7, weeks apart</text>

  <!-- ground line -->
  <line x1="64" y1="326" x2="756" y2="326" stroke="#33415c" stroke-width="1.2"/>

  <!-- towers v1..v7 : block colors cycle cyan → blue → violet → green -->
  <g font-size="12" font-weight="bold" fill="#93a5c8" text-anchor="middle">
    <text x="104" y="352">v1</text><text x="206" y="352">v2</text><text x="308" y="352">v3</text>
    <text x="410" y="352">v4</text><text x="512" y="352">v5</text><text x="614" y="352">v6</text>
    <text x="716" y="352">v7</text>
  </g>

  <!-- v1: 2 blocks -->
  <rect x="64" y="302" width="80" height="24" rx="4" fill="#22d3ee"/><rect x="64" y="278" width="80" height="24" rx="4" fill="#60a5fa"/>
  <!-- v2: 3 blocks -->
  <rect x="166" y="302" width="80" height="24" rx="4" fill="#22d3ee"/><rect x="166" y="278" width="80" height="24" rx="4" fill="#60a5fa"/><rect x="166" y="254" width="80" height="24" rx="4" fill="#a78bfa"/>
  <!-- v3: 4 blocks -->
  <rect x="268" y="302" width="80" height="24" rx="4" fill="#22d3ee"/><rect x="268" y="278" width="80" height="24" rx="4" fill="#60a5fa"/><rect x="268" y="254" width="80" height="24" rx="4" fill="#a78bfa"/><rect x="268" y="230" width="80" height="24" rx="4" fill="#34d399"/>
  <!-- v4: 5 blocks -->
  <rect x="370" y="302" width="80" height="24" rx="4" fill="#22d3ee"/><rect x="370" y="278" width="80" height="24" rx="4" fill="#60a5fa"/><rect x="370" y="254" width="80" height="24" rx="4" fill="#a78bfa"/><rect x="370" y="230" width="80" height="24" rx="4" fill="#34d399"/><rect x="370" y="206" width="80" height="24" rx="4" fill="#22d3ee"/>
  <!-- v5: 6 blocks -->
  <rect x="472" y="302" width="80" height="24" rx="4" fill="#22d3ee"/><rect x="472" y="278" width="80" height="24" rx="4" fill="#60a5fa"/><rect x="472" y="254" width="80" height="24" rx="4" fill="#a78bfa"/><rect x="472" y="230" width="80" height="24" rx="4" fill="#34d399"/><rect x="472" y="206" width="80" height="24" rx="4" fill="#22d3ee"/><rect x="472" y="182" width="80" height="24" rx="4" fill="#60a5fa"/>
  <!-- v6: 7 blocks -->
  <rect x="574" y="302" width="80" height="24" rx="4" fill="#22d3ee"/><rect x="574" y="278" width="80" height="24" rx="4" fill="#60a5fa"/><rect x="574" y="254" width="80" height="24" rx="4" fill="#a78bfa"/><rect x="574" y="230" width="80" height="24" rx="4" fill="#34d399"/><rect x="574" y="206" width="80" height="24" rx="4" fill="#22d3ee"/><rect x="574" y="182" width="80" height="24" rx="4" fill="#60a5fa"/><rect x="574" y="158" width="80" height="24" rx="4" fill="#a78bfa"/>
  <!-- v7: 8 blocks -->
  <rect x="676" y="302" width="80" height="24" rx="4" fill="#22d3ee"/><rect x="676" y="278" width="80" height="24" rx="4" fill="#60a5fa"/><rect x="676" y="254" width="80" height="24" rx="4" fill="#a78bfa"/><rect x="676" y="230" width="80" height="24" rx="4" fill="#34d399"/><rect x="676" y="206" width="80" height="24" rx="4" fill="#22d3ee"/><rect x="676" y="182" width="80" height="24" rx="4" fill="#60a5fa"/><rect x="676" y="158" width="80" height="24" rx="4" fill="#a78bfa"/><rect x="676" y="134" width="80" height="24" rx="4" fill="#34d399"/>

  <!-- a failed brick gets pulled (v3) -->
  <path d="M 308 226 C 330 214, 336 190, 348 162" fill="none" stroke="#fb7185" stroke-width="1.4" stroke-dasharray="3 3"/>
  <g transform="rotate(14 330 148)">
    <rect x="302" y="138" width="56" height="20" rx="5" fill="#fb7185"/>
    <text x="330" y="153" font-size="13" font-weight="bold" fill="#1a0f14" text-anchor="middle">×</text>
  </g>
  <text x="368" y="146" font-size="10.5" fill="#fda4af">a brick that failed</text>
  <text x="368" y="160" font-size="10.5" fill="#fda4af">gets pulled, not mourned</text>

  <!-- dashed outline: the shape imagined on day one, above v7 -->
  <rect x="674" y="40" width="84" height="94" rx="8" fill="none" stroke="#7dd3fc" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="716" y="30" font-size="11" fill="#7dd3fc" text-anchor="middle">✦</text>
  <line x1="716" y1="94" x2="716" y2="130" stroke="#7dd3fc" stroke-opacity="0.4" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- caption lines -->
  <text x="400" y="372" font-size="10.5" fill="#8fa3c8" text-anchor="middle">solid bricks = features that survived your daily use · dashed outline = the product you imagined on day one</text>
  <text x="400" y="389" font-size="10.5" fill="#8fa3c8" text-anchor="middle">reality built something sturdier than the drawing — and it is still growing</text>
</svg>
